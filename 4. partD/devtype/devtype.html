<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../Global/root.css">
    <link rel="stylesheet" href="./devtype.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>DevType Dojo - Code Typing Speedrun | NoviCodes</title>
</head>
<body class="devtype-page">
    <main class="devtype-container">
        <!-- Header & Back Button -->
        <header class="devtype-header">
            <a href="../../index.html" class="back-dash-btn">
                <span>🏠 Dashboard</span>
            </a>

            <div class="devtype-title-wrap">
                <h1>⌨️ DevType Dojo</h1>
                <p>Code Typing Speedrun & Symbol Muscle Memory Trainer</p>
            </div>

            <div style="width: 100px;"></div>
        </header>

        <!-- Mode & Timer Selectors -->
        <div class="selectors-container">
            <div class="mode-selector-bar">
                <button class="mode-btn" data-mode="html">🌐 HTML Tags</button>
                <button class="mode-btn" data-mode="css">🎨 CSS Rules</button>
                <button class="mode-btn active" data-mode="js">⚡ JS ES6+</button>
                <button class="mode-btn" data-mode="react">⚛️ React Hooks</button>
            </div>

            <div class="timer-selector-bar">
                <span class="timer-label">⏱️ Mode:</span>
                <button class="timer-btn" data-time="15">15s</button>
                <button class="timer-btn active" data-time="30">30s</button>
                <button class="timer-btn" data-time="60">60s</button>
                <button class="timer-btn" data-time="0">∞ Snippet</button>
            </div>
        </div>

        <!-- Live Stats HUD -->
        <div class="stats-hud">
            <div class="stat-box">
                <div class="stat-label">🚀 Speed (WPM)</div>
                <div class="stat-value" id="wpmVal">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">⏱️ Time</div>
                <div class="stat-value" id="timerVal" style="color: #f59e0b;">30s</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🎯 Accuracy</div>
                <div class="stat-value" id="accuracyVal">100%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🏆 High Score</div>
                <div class="stat-value" id="highScoreVal" style="color: #10b981;">0</div>
            </div>
        </div>

        <!-- Code Typing Display Area -->
        <div class="typing-area-card" title="Click to start typing code!">
            <div class="code-display" id="codeDisplay"></div>
            <textarea id="hiddenInput" spellcheck="false" autocomplete="off" capitalize="off"></textarea>
        </div>

        <!-- Monkeytype-Style Controls & Shortcut Hints -->
        <div class="controls-bar">
            <div style="display: flex; gap: 10px;">
                <button class="restart-btn" id="retryBtn">
                    <span>🔄 Retry Snippet</span>
                </button>
                <button class="restart-btn" id="nextBtn" style="background: #2563eb; border-color: #3b82f6;">
                    <span>⏭ Next Snippet</span>
                </button>
            </div>

            <div class="shortcut-hint">
                Press <kbd>Tab</kbd> to indent code like VS Code | Press <kbd>Esc</kbd> to restart
            </div>
        </div>
    </main>

    <script src="./devtype.js"></script>
</body>
</html>
