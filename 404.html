<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Global/root.css">
    <title>404 - Page Not Found | NoviCodes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle Background Glow Spheres */
        .glow-sphere-1 {
            position: absolute;
            top: 15%;
            left: 20%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
        }

        .glow-sphere-2 {
            position: absolute;
            bottom: 15%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
        }

        .error-card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-top: 4px solid #2563eb;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 42px 32px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            margin: 20px;
        }

        .badge-404 {
            display: inline-block;
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .error-icon-wrap {
            font-size: 4.5rem;
            margin-bottom: 16px;
            line-height: 1;
            filter: drop-shadow(0 8px 16px rgba(37, 99, 235, 0.3));
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 12px 0;
            line-height: 1.25;
        }

        .error-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 28px 0;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 0.92rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
            width: 100%;
        }

        .primary-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.45);
        }

        .secondary-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
        }

        .secondary-btn:hover {
            background: #334155;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 480px) {
            .error-card {
                padding: 28px 18px;
                border-radius: 18px;
            }

            .error-icon-wrap {
                font-size: 3.6rem;
            }

            .error-title {
                font-size: 1.4rem;
            }

            .error-desc {
                font-size: 0.86rem;
                line-height: 1.5;
                margin-bottom: 22px;
            }

            .action-btn {
                padding: 12px 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <main class="error-card">
        <div class="badge-404">ERROR CODE: 404</div>
        
        <div class="error-icon-wrap">🧭</div>

        <h1 class="error-title">Lost in the Dojo Matrix?</h1>
        
        <p class="error-desc">
            The page or lesson you are looking for doesn't exist, was renamed, or has been moved to another route in the codebase.
        </p>

        <div class="button-group">
            <a href="./index.html" class="action-btn primary-btn">
                <span>🏠 Return to NoviCodes Dashboard</span>
            </a>
            <button onclick="window.history.back()" class="action-btn secondary-btn">
                <span>↩️ Go Back to Previous Page</span>
            </button>
        </div>
    </main>
</body>
</html>
